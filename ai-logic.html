<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo of Thought</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #050608;
      --text-color: #dfe6f1;
      --accent-color: #9fb1d1;
      --highlight-color: #f6c344;
      --choice-bg: rgba(14, 16, 22, 0.78);
      --choice-border: rgba(255, 255, 255, 0.08);
      --choice-hover-bg: rgba(246, 195, 68, 0.12);
      --choice-hover-border: rgba(246, 195, 68, 0.45);
      --font-serif: 'Cormorant Garamond', serif;
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Cinzel', serif;
    }

    body {
      background: radial-gradient(120% 120% at 15% 15%, rgba(246, 195, 68, 0.08), transparent),
        radial-gradient(100% 100% at 80% 0%, rgba(78, 205, 196, 0.12), transparent),
        var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-sans);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Noise Texture */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.07'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: -1;
    }

    /* Vignette */
    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
      z-index: -1;
    }

    header {
      padding: 24px;
      text-align: center;
      z-index: 10;
      opacity: 0.8;
      position: sticky;
      top: 0;
      background: linear-gradient(to bottom, rgba(5,6,8,0.95), rgba(5,6,8,0.7));
      backdrop-filter: blur(6px);
    }

    .title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--highlight-color);
      text-shadow: 0 0 10px rgba(255,255,255,0.1);
    }
    .progress-chip {
      align-self: center;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      color: #f6f7ff;
      background: linear-gradient(120deg, rgba(246,195,68,0.16), rgba(78,205,196,0.14));
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: inline-flex;
      gap: 6px;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }

    #main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      position: relative;
      padding: 0 24px;
      gap: 12px;
    }

    #log {
      flex: 1;
      padding: 26px 28px 160px 28px;
      overflow: visible;
      display: flex;
      flex-direction: column;
      gap: 32px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 18px;
      box-shadow: 0 12px 38px rgba(0, 0, 0, 0.35);
    }

    .msg {
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); filter: blur(2px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    .msg.game {
      font-family: var(--font-serif);
      font-size: 1.32rem;
      color: #f5f7ff;
      text-align: left;
      font-weight: 400;
      letter-spacing: 0.01em;
      line-height: 1.72;
      word-spacing: 0.02em;
    }

    .msg.player {
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: var(--highlight-color);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin: 14px 0 10px 0;
      opacity: 0.82;
      border-top: 1px solid rgba(255,255,255,0.14);
      border-bottom: 1px solid rgba(255,255,255,0.14);
      padding: 10px 0;
      width: 100%;
    }

    .msg.system {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      color: #ef4444;
      text-align: center;
      background: rgba(239, 68, 68, 0.1);
      padding: 8px;
      border-radius: 4px;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    #controls-area {
      position: sticky;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(to top, rgba(5,6,8,0.96) 0%, rgba(5,6,8,0.9) 65%, transparent 100%);
      padding: 18px 12px 22px 12px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 20;
      gap: 12px;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 640px;
      transition: opacity 0.3s ease;
    }

    .choices.empty {
      opacity: 0.4;
      pointer-events: none;
      text-align: center;
      font-style: italic;
      font-family: var(--font-serif);
      font-size: 1.1rem;
    }

    .choice-btn {
      background: linear-gradient(145deg, rgba(20, 25, 34, 0.95), rgba(14, 16, 22, 0.82));
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f6f8ff;
      padding: 18px 22px;
      font-family: var(--font-sans);
      font-size: 1.02rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.25, 0.8, 0.25, 1);
      border-radius: 14px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(12px);
      box-shadow: 0 14px 36px rgba(0,0,0,0.38);
    }

    .choice-btn:hover {
      background: var(--choice-hover-bg);
      border-color: var(--choice-hover-border);
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.3);
      color: #fff;
    }

    .choice-btn:active {
      transform: translateY(0);
    }

    .choice-btn.last-picked {
      outline: 2px solid var(--highlight-color);
      outline-offset: 2px;
      box-shadow: 0 0 0 4px rgba(246, 195, 68, 0.15), 0 14px 36px rgba(0,0,0,0.4);
    }

    #status {
      margin-top: 6px;
      font-size: 0.78rem;
      color: #d0d8ea;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      opacity: 0;
      transition: opacity 0.5s;
    }
    
    #status:not(:empty) {
      opacity: 1;
    }

    /* Telltale Notification */
    .telltale-notification {
      position: fixed;
      top: 30px;
      left: 30px;
      background: rgba(15, 15, 15, 0.95);
      color: #fff;
      padding: 14px 24px;
      border-left: 3px solid #fff;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateX(-30px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 1000;
    }

    .telltale-notification.show {
      opacity: 1;
      transform: translateX(0);
    }

    /* Responsive */
    @media (max-width: 600px) {
      body {
        overflow-x: hidden;
      }
      #main-container {
        padding: 0 14px;
      }
      #log {
        padding: 16px 14px 150px 14px;
      }
      .msg.game {
        font-size: 1.18rem;
      }
      .choice-btn {
        padding: 14px 16px;
        font-size: 0.95rem;
      }
      #controls-area {
        padding: 24px 14px 22px 14px;
      }
    }
  </style>
</head>
<body>
  <div id="notification-area" class="telltale-notification"></div>
  
  <header>
    <div class="title">Echo of Thought</div>
    <div id="progress-chip" class="progress-chip">Episode 1 · Gerbang</div>
  </header>

  <div id="main-container">
    <div id="log"></div>
    
    <div id="controls-area">
      <div id="choices" class="choices empty">Echo is listening...</div>
      <div id="status">Ready</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

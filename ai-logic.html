  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Voice Story Prototype</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111;
        color: #eee;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      header {
        padding: 12px 16px;
        background: #181818;
        border-bottom: 1px solid #333;
        font-weight: 600;
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
      }

      .title {
        font-size: 1.05rem;
        letter-spacing: 0.02em;
      }

      .api-controls {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-weight: 400;
        font-size: 0.85rem;
        color: #bbb;
      }

      .api-controls label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #aaa;
      }

    .api-controls .provider-row,
    .api-controls .key-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .api-controls select {
      background: #111;
      color: #fff;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 6px 10px;
      min-width: 180px;
    }

    .api-controls input {
      background: #111;
      color: #fff;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 6px 10px;
        min-width: 220px;
      }

      .api-controls button {
        background: #2d52a2;
        border: none;
        color: #fff;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.85rem;
      }

      .api-controls button:hover {
        background: #3c64c5;
      }

      .api-controls #clear-key {
        background: #444;
      }

      .api-controls #clear-key:hover {
        background: #555;
      }

      #log {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
      }

      .msg {
        margin-bottom: 10px;
        max-width: 80%;
        line-height: 1.4;
        white-space: pre-wrap;
      }

      .msg.system {
        color: #aaa;
        font-size: 0.9rem;
      }

      .msg.player {
        background: #2b4c7e;
        padding: 8px 10px;
        border-radius: 12px 12px 0 12px;
        margin-left: auto;
      }

      .msg.game {
        background: #222;
        padding: 8px 10px;
        border-radius: 12px 12px 12px 0;
        margin-right: auto;
      }

    footer {
      padding: 12px 16px;
      background: #181818;
      border-top: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      width: 100%;
    }

    .choices.empty {
      color: #777;
      font-style: italic;
    }

    .choice-btn {
      flex: 1 1 calc(50% - 10px);
      min-width: 160px;
      background: #262b3a;
      border: 1px solid #394866;
      border-radius: 10px;
      color: #fff;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, border 0.15s;
    }

    .choice-btn:hover {
      background: #33507f;
      border-color: #4f6da6;
    }

    #status {
        font-size: 0.85rem;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <header>
    <div class="title">Voice Story - Prototype</div>
    <div class="api-controls">
      <div class="provider-row">
        <label for="provider-select">Provider</label>
        <select id="provider-select">
          <option value="openrouter">OpenRouter</option>
          <option value="groq">Groq</option>
        </select>
      </div>
      <label for="api-key" id="api-key-label">OpenRouter API Key</label>
      <div class="key-row">
        <input type="password" id="api-key" placeholder="sk-or-..." autocomplete="off" />
        <button id="save-key" type="button">Save</button>
        <button id="clear-key" type="button">Clear</button>
      </div>
      <small id="api-hint">Get one at openrouter.ai (stored locally only).</small>
    </div>
  </header>

  <div id="log"></div>

  <div id="choices" class="choices empty">Waiting for Echo to offer actions...</div>

  <footer>
    <div id="status">Loading...</div>
  </footer>

    <script>
      (function () {
        "use strict";

        const CLIENT_NAME = "Echo of Thought Prototype"; // Used for OpenRouter's X-Title header.
        const PROVIDER_CHOICE_STORAGE = "echo-of-thought-provider-choice";
        const API_KEY_MAP_STORAGE = "echo-of-thought-api-key-map";
        const MAX_HISTORY_MESSAGES = 12;
        const REQUIRED_PAYLOAD_KEYS = ["response", "prompt", "scene", "relationship_delta", "flags", "choices"];
        const REFERER_HEADER = (() => {
          try {
            const origin = window.location.origin;
            if (origin && origin !== "null") {
              return origin;
            }
            const href = window.location.href;
            return href && href.startsWith("http") ? href : "https://openrouter.ai";
          } catch (_) {
            return "https://openrouter.ai";
          }
        })();
        const LEGACY_STORAGE_KEYS = [
          { storage: "echo-of-thought-openrouter-key", provider: "openrouter" },
          { storage: "echo-of-thought-groq-key", provider: "groq" }
        ];
        const PROVIDERS = {
          openrouter: {
            id: "openrouter",
            displayName: "OpenRouter",
            endpoint: "https://openrouter.ai/api/v1/chat/completions",
            model: "meta-llama/llama-3.3-70b-instruct",
            keyLabel: "OpenRouter API Key",
            placeholder: "sk-or-...",
            hint: "Get one at openrouter.ai (stored locally only).",
            headers: (key) => ({
              "Content-Type": "application/json",
              Authorization: `Bearer ${key}`,
              "HTTP-Referer": REFERER_HEADER,
              "X-Title": CLIENT_NAME
            })
          },
          groq: {
            id: "groq",
            displayName: "Groq",
            endpoint: "https://api.groq.com/openai/v1/chat/completions",
            model: "llama-3.3-70b-versatile",
            keyLabel: "Groq API Key",
            placeholder: "gsk_...",
            hint: "Generate at console.groq.com (stored locally only).",
            headers: (key) => ({
              "Content-Type": "application/json",
              Authorization: `Bearer ${key}`
            })
          }
        };
        const WORLD_BIBLE = {
          premise: "Late-summer transfer student navigating first week at Shibuya High.",
          location: "Tokyo, modern day. Events stay inside campus until explicitly moved.",
          cast: ["Player", "Yuta", "homeroom teacher (Ms. Kuroda)", "background classmates"],
          tone: "Grounded YA drama: intimate, sensory, no fantasy elements or sudden genre shifts.",
          forbidden: [
            "new supernatural powers",
            "new characters speaking without prior approval",
            "time jumps outside the school day",
            "locations outside Shibuya High",
            "romantic interactions that go beyond PG-13 (no explicit sexual content, no physical intimacy descriptions beyond holding hands or a brief hug)"
          ]
        };
        const SCENE_RULES = {
          intro: {
            location: "Homeroom 2-A, moments before first bell.",
            cast: ["Player", "Yuta", "teacher at podium (mostly observing)", "background classmates"],
            mood: "buzzy, first-day nerves, hopeful curiosity.",
            allowedActions: ["greet yuta", "ignore yuta", "observe classroom", "prepare for teacher", "share feelings"],
            notes: [
              "Yuta sits near the window; he already waved first.",
              "Teacher is about to start roll call but has not spoken yet."
            ]
          },
          classroom: {
            location: "Same homeroom during math lecture.",
            cast: ["Player", "Yuta", "teacher"],
            mood: "quiet chalk sounds, whispered rebellion.",
            allowedActions: ["listen to teacher", "whisper to yuta", "pass note", "focus on notebook", "ask to repeat question"],
            notes: [
              "Class is ongoing; keep voices low.",
              "No other students jump into the conversation without prompting."
            ]
          },
          hallway: {
            location: "Second-floor hallway right after class.",
            cast: ["Player", "Yuta", "passing students (background)"],
            mood: "echoing footsteps, adrenaline from recent class.",
            allowedActions: ["follow yuta", "ask about club", "head to locker", "excuse yourself"],
            notes: ["Everyone is moving toward lunch; no teachers nearby."]
          },
          default: {
            location: "Somewhere on campus still during first morning.",
            cast: ["Player", "Yuta"],
            mood: "calm but alert.",
            allowedActions: ["check surroundings", "talk to yuta", "reflect"],
            notes: ["Stay on school grounds; no surprise visitors."]
          }
        };
        const FEW_SHOT_MESSAGES = [
          {
            role: "user",
            content: [
              "Player line: I smile nervously at Yuta and whisper hi.",
              "",
              "State summary:",
              "Scene: intro",
              "Relationship (Yuta): 0",
              "Has introduced self: false",
              "Active hook: Yuta is waiting for acknowledgement.",
              "",
              "World bible:",
              "Stay inside Shibuya High, grounded teen drama, only listed characters may speak.",
              "",
              "Scene directives:",
              "Location: Homeroom 2-A before class.",
              "",
              "Respond strictly with JSON as described in the system prompt. Never add commentary outside JSON."
            ].join("\n")
          },
          {
            role: "assistant",
            content:
              "{\"response\":\"You lean toward Yuta and breathe out a shy hello, palm still damp against your bag strap. His grin softens into something conspiratorial as the room hushes for the bell.\",\"prompt\":\"How do you introduce yourself?\",\"scene\":\"intro\",\"relationship_delta\":2,\"flags\":{\"hasIntroducedSelf\":true},\"choices\":[\"Tell him your name.\",\"Ask if he has advice for new students.\",\"Confess you're nervous.\",\"Crack a small joke to break the tension.\"]}"
          }
        ];
        const SYSTEM_PROMPT = [
          "You are Echo, an AI narrator for a choice-driven teen drama set in a Japanese high school.",
          "Write in immersive second-person prose, keeping each turn under roughly 120 words.",
          "Tie every beat to previous events. If the player was kind, show that trust grows. If they were cold, let tension linger.",
          "End every turn with four concise options that vary in focus (internal reflection, teacher, classmates, environment, or Yuta). Only push toward Yuta if the player's recent actions invite it.",
          "Stay within approved locations, characters, and actions. Never invent new powers, time jumps, or surprise characters.",
          "Romance must stay PG-13: no sexual content, no explicit body descriptions, no touching beyond a brief hug or holding hands.",
          "If the player requests forbidden or unsafe content, refuse politely and remind them of the rules; do not describe the forbidden content.",
          "Respond ONLY with minified JSON containing keys: response (string), prompt (string), scene (string), relationship_delta (number), flags (object with hasIntroducedSelf boolean), choices (array of four concise options).",
          "Never add commentary or any text outside that JSON."
        ].join(" ");

        const logEl = document.getElementById("log");
        const choicesEl = document.getElementById("choices");
        const statusEl = document.getElementById("status");
        const apiKeyInput = document.getElementById("api-key");
        const saveKeyBtn = document.getElementById("save-key");
        const clearKeyBtn = document.getElementById("clear-key");
        const providerSelect = document.getElementById("provider-select");
        const apiKeyLabelEl = document.getElementById("api-key-label");
        const apiHintEl = document.getElementById("api-hint");

        const conversationHistory = [];
        const choiceHistory = [];
        const gameState = {
          scene: "intro",
          relationship: { yuta: 0 },
          hasIntroducedSelf: false
        };

        function rememberChoice(text) {
          if (!text) return;
          choiceHistory.push(text);
          if (choiceHistory.length > 6) {
            choiceHistory.shift();
          }
        }

        function describeChoiceHistory() {
          if (!choiceHistory.length) {
            return "No explicit choices have been made yet.";
          }
          return choiceHistory.map((choice, idx) => `#${idx + 1}: ${choice}`).join("\n");
        }

        let providerKeys = {};
        try {
          providerKeys = JSON.parse(window.localStorage.getItem(API_KEY_MAP_STORAGE) || "{}") || {};
        } catch (_) {
          providerKeys = {};
        }
        LEGACY_STORAGE_KEYS.forEach(({ storage, provider }) => {
          if (providerKeys[provider]) {
            return;
          }
          try {
            const legacyValue = window.localStorage.getItem(storage);
            if (legacyValue) {
              providerKeys[provider] = legacyValue;
              window.localStorage.removeItem(storage);
            }
          } catch (_) {
            /* ignore */
          }
        });
        if (Object.keys(providerKeys).length > 0) {
          try {
            window.localStorage.setItem(API_KEY_MAP_STORAGE, JSON.stringify(providerKeys));
          } catch (_) {
            /* ignore */
          }
        }
        const storedProviderChoice = window.localStorage.getItem(PROVIDER_CHOICE_STORAGE);
        let currentProvider = storedProviderChoice || "openrouter";
        if (!PROVIDERS[currentProvider]) {
          currentProvider = "openrouter";
        }
        if (!storedProviderChoice && !providerKeys[currentProvider]) {
          const fallbackProvider = Object.keys(providerKeys).find((key) => PROVIDERS[key] && providerKeys[key]);
          if (fallbackProvider) {
            currentProvider = fallbackProvider;
          }
        }
        providerSelect.value = currentProvider;

        let apiKey = providerKeys[currentProvider] || "";

        function getProviderConfig() {
          return PROVIDERS[currentProvider];
        }

        function persistKeyMap() {
          try {
            window.localStorage.setItem(API_KEY_MAP_STORAGE, JSON.stringify(providerKeys));
          } catch (error) {
            console.warn("Unable to persist API keys map:", error);
          }
        }

        function syncProviderUI() {
          const config = getProviderConfig();
          providerSelect.value = currentProvider;
          apiKeyLabelEl.textContent = config.keyLabel;
          apiKeyInput.placeholder = config.placeholder;
          apiHintEl.textContent = config.hint;
          const stored = providerKeys[currentProvider] || "";
          apiKeyInput.value = stored;
          apiKey = stored;
        }

        syncProviderUI();

        let isProcessingTurn = false;
        let awaitingChoice = false;
        let currentChoices = [];

        function getSceneConfig(scene) {
          return SCENE_RULES[scene] || SCENE_RULES.default;
        }

        function describeWorldBible() {
          return [
            `Premise: ${WORLD_BIBLE.premise}`,
            `Primary location: ${WORLD_BIBLE.location}`,
            `Allowed cast: ${WORLD_BIBLE.cast.join(", ")}`,
            `Tone: ${WORLD_BIBLE.tone}`,
            `Forbidden topics: ${WORLD_BIBLE.forbidden.join(", ")}`
          ].join("\n");
        }

        function describeSceneRules(scene) {
          const config = getSceneConfig(scene);
          return [
            `Scene codename: ${scene}`,
            `Location focus: ${config.location}`,
            `Cast allowed to speak: ${config.cast.join(", ")}`,
            `Mood anchors: ${config.mood}`,
            `Allowed actions: ${config.allowedActions.join(" | ")}`,
            config.notes && config.notes.length ? `Non-negotiable facts: ${config.notes.join(" ")}` : ""
          ]
            .filter(Boolean)
            .join("\n");
        }

        function describeRelationshipBand(score) {
          if (score >= 12) return "trusting";
          if (score >= 5) return "warming";
          if (score <= -8) return "hostile";
          if (score <= -3) return "icy";
          return "uncertain";
        }

        function computeActiveHook() {
          if (!gameState.hasIntroducedSelf) {
            return "Yuta is still waiting for you to introduce yourself.";
          }
          if (gameState.relationship.yuta >= 8) {
            return "Yuta is ready to confide in you if you reach out.";
          }
          if (gameState.relationship.yuta <= -4) {
            return "Yuta keeps his guard up and may push you away.";
          }
          return "Yuta is curious about your next move.";
        }

        function addMessage(text, role = "game") {
          const div = document.createElement("div");
          div.className = "msg " + role;
          div.textContent = text;
          logEl.appendChild(div);
          logEl.scrollTop = logEl.scrollHeight;
        }

        function setStatus(text) {
          statusEl.textContent = text;
        }

        function renderChoices(choices) {
          currentChoices = Array.isArray(choices) ? choices.filter((choice) => typeof choice === "string" && choice.trim()) : [];
          choicesEl.innerHTML = "";
          if (!currentChoices.length) {
            choicesEl.classList.add("empty");
            choicesEl.textContent = "Echo is thinking...";
            awaitingChoice = false;
            return;
          }
          choicesEl.classList.remove("empty");
          awaitingChoice = true;
          const fragment = document.createDocumentFragment();
          currentChoices.forEach((choiceText, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "choice-btn";
            button.textContent = `${index + 1}. ${choiceText}`;
            button.addEventListener("click", () => handleChoiceSelection(index));
            fragment.appendChild(button);
          });
          choicesEl.appendChild(fragment);
          setStatus("Choose your next move.");
        }

        function clearChoices(message = "Echo is thinking...") {
          awaitingChoice = false;
          currentChoices = [];
          choicesEl.classList.add("empty");
          choicesEl.textContent = message;
        }

        function handleChoiceSelection(index) {
          if (!currentChoices[index] || isProcessingTurn) {
            return;
          }
          const choiceText = currentChoices[index];
          clearChoices("Echo is considering your choice...");
          addMessage(`You pick: ${choiceText}`, "player");
          rememberChoice(choiceText);
          runStoryTurn(choiceText, { choiceIndex: index });
        }

        providerSelect.addEventListener("change", () => {
          const nextProvider = providerSelect.value;
          currentProvider = PROVIDERS[nextProvider] ? nextProvider : "openrouter";
          window.localStorage.setItem(PROVIDER_CHOICE_STORAGE, currentProvider);
          syncProviderUI();
          const config = getProviderConfig();
          addMessage(`Provider switched to ${config.displayName}.`, "system");
          if (!apiKey) {
            addMessage(`Tip: add your ${config.displayName} API key above to let the AI drive the narrative.`, "system");
          }
        });

        function remember(role, content) {
          conversationHistory.push({ role, content });
          if (conversationHistory.length > MAX_HISTORY_MESSAGES) {
            conversationHistory.splice(0, conversationHistory.length - MAX_HISTORY_MESSAGES);
          }
        }

        function createStateSnapshot() {
          return [
            `Scene: ${gameState.scene}`,
            `Relationship (Yuta): ${gameState.relationship.yuta} (${describeRelationshipBand(
              gameState.relationship.yuta
            )})`,
            `Has introduced self: ${gameState.hasIntroducedSelf}`,
            `Active hook: ${computeActiveHook()}`
          ].join("\n");
        }

        function composeUserMessage(playerText, meta = {}) {
          const summary = createStateSnapshot();
          const playerDescriptor =
            typeof meta.choiceIndex === "number"
              ? `Chosen option #${meta.choiceIndex + 1}: ${playerText}`
              : meta.isBootstrap
              ? "Bootstrap event triggered to start the day."
              : `Player line: ${playerText}`;
          return [
            playerDescriptor,
            "",
            "Recent player selections:",
            describeChoiceHistory(),
            "",
            "Canon snapshot:",
            summary,
            "",
            "World rules:",
            describeWorldBible(),
            "",
            "Scene directives:",
            describeSceneRules(gameState.scene),
            "",
            "Obligations:",
            "- Keep narration under ~120 words and stay in second person.",
            "- No new characters, powers, or locations beyond what the scene lists.",
            "- If the player asks for anything forbidden (e.g., leaving school grounds, adding supernatural elements, explicit romance), gently remind them of the boundaries instead of fulfilling the request.",
            "- Provide exactly four concise options the player can choose from next. Vary their focus so not all revolve around Yuta unless the player keeps pursuing him.",
            "",
            "Respond strictly with JSON as described in the system prompt. Never add commentary outside JSON."
          ].join("\n");
        }

        function buildMessages(playerText, meta = {}) {
          const trimmedHistory = conversationHistory.slice(-MAX_HISTORY_MESSAGES);
          return [
            { role: "system", content: SYSTEM_PROMPT },
            ...FEW_SHOT_MESSAGES,
            ...trimmedHistory,
            { role: "user", content: composeUserMessage(playerText, meta) }
          ];
        }

        function speak() {
          // Text-to-speech disabled to keep the experience silent.
        }

        function applyStateUpdates(payload) {
          if (payload.scene) {
            gameState.scene = payload.scene;
          }
          if (typeof payload.relationship_delta === "number" && !Number.isNaN(payload.relationship_delta)) {
            gameState.relationship.yuta += payload.relationship_delta;
          }
          if (payload.flags && typeof payload.flags === "object") {
            if (typeof payload.flags.hasIntroducedSelf === "boolean") {
              gameState.hasIntroducedSelf = payload.flags.hasIntroducedSelf;
            }
          }
        }

        function cleanJsonCandidate(raw) {
          if (typeof raw !== "string") {
            return "";
          }
          let text = raw.trim();
          if (!text) return "";
          if (text.startsWith("```")) {
            text = text.replace(/^```(?:json)?/i, "");
            const closingIndex = text.lastIndexOf("```");
            if (closingIndex >= 0) {
              text = text.slice(0, closingIndex);
            }
            text = text.trim();
          }
          return text;
        }

        function normalizeQuotes(text) {
          return text
            .replace(/[“”]/g, '"')
            .replace(/[‘’]/g, "'")
            .replace(/[\u2013\u2014]/g, "-");
        }

        function extractBalancedJson(text) {
          let start = -1;
          let depth = 0;
          let inString = false;
          let escapeNext = false;
          for (let i = 0; i < text.length; i++) {
            const char = text[i];
            if (escapeNext) {
              escapeNext = false;
              continue;
            }
            if (char === "\\") {
              escapeNext = true;
              continue;
            }
            if (char === '"' && !escapeNext) {
              inString = !inString;
              continue;
            }
            if (inString) {
              continue;
            }
            if (char === "{") {
              if (depth === 0) {
                start = i;
              }
              depth++;
            } else if (char === "}") {
              if (depth > 0) {
                depth--;
                if (depth === 0 && start !== -1) {
                  return text.slice(start, i + 1);
                }
              }
            }
          }
          if (start === 0 && depth === 0) {
            return text;
          }
          return "";
        }

        function escapeBareNewlines(text) {
          let inString = false;
          let escapeNext = false;
          let output = "";
          for (let i = 0; i < text.length; i++) {
            const char = text[i];
            if (escapeNext) {
              output += char;
              escapeNext = false;
              continue;
            }
            if (char === "\\") {
              escapeNext = true;
              output += char;
              continue;
            }
            if (char === '"') {
              inString = !inString;
              output += char;
              continue;
            }
            if (inString && (char === "\n" || char === "\r" || char === "\t")) {
              if (char === "\t") {
                output += "\\t";
              } else {
                output += "\\n";
              }
              continue;
            }
            output += char;
          }
          return output;
        }

        function fixTrailingCommas(text) {
          return text.replace(/,\s*(\}|\])/g, "$1");
        }

        function normalizeChoices(rawChoices) {
          const list = Array.isArray(rawChoices) ? rawChoices : [];
          const cleaned = list
            .map((choice) => {
              if (typeof choice === "string") {
                return choice.trim();
              }
              if (choice && typeof choice.text === "string") {
                return choice.text.trim();
              }
              return "";
            })
            .filter(Boolean);
          while (cleaned.length < 4) {
            cleaned.push("Take a breath and observe the room.");
          }
          return cleaned.slice(0, 4);
        }

        function parseAiResponse(result) {
          const content = result?.choices?.[0]?.message?.content;
          if (!content) {
            throw new Error("Story AI returned an empty response.");
          }
          const text =
            Array.isArray(content) && content.length
              ? content.map((chunk) => (typeof chunk === "string" ? chunk : chunk?.text ?? "")).join("")
              : content;
          const cleaned = normalizeQuotes(cleanJsonCandidate(text));
          const balanced = extractBalancedJson(cleaned) || cleaned;
          const sanitized = fixTrailingCommas(escapeBareNewlines(balanced));
          try {
            return JSON.parse(sanitized);
          } catch (error) {
            console.warn("AI JSON parse failed. Raw payload:", sanitized, error);
            try {
              // As a last resort, evaluate the object literal.
              // eslint-disable-next-line no-new-func
              return new Function(`return (${sanitized});`)();
            } catch (fallbackError) {
              console.error("Eval fallback failed.", fallbackError);
              throw new Error("AI returned invalid JSON: " + fallbackError.message);
            }
          }
        }

        function ensurePayloadIntegrity(payload) {
          REQUIRED_PAYLOAD_KEYS.forEach((key) => {
            if (!(key in payload)) {
              throw new Error(`Story JSON missing key: ${key}`);
            }
          });
          if (typeof payload.response !== "string" || !payload.response.trim()) {
            throw new Error("Story JSON missing response text.");
          }
          if (typeof payload.prompt !== "string" || !payload.prompt.trim()) {
            payload.prompt = "What do you say next?";
          }
          if (typeof payload.relationship_delta !== "number" || Number.isNaN(payload.relationship_delta)) {
            payload.relationship_delta = 0;
          }
          if (!payload.scene || typeof payload.scene !== "string") {
            payload.scene = gameState.scene;
          }
          if (!SCENE_RULES[payload.scene]) {
            payload.scene = gameState.scene;
          }
          if (!payload.flags || typeof payload.flags !== "object") {
            payload.flags = {};
          }
          if (typeof payload.flags.hasIntroducedSelf !== "boolean") {
            payload.flags.hasIntroducedSelf = gameState.hasIntroducedSelf;
          }
          payload.choices = normalizeChoices(payload.choices);
          return payload;
        }

        // Sends the conversation to the model and asks for the next beat.
        async function requestStoryBeat(playerText, meta = {}) {
          const config = getProviderConfig();
          const payload = {
            model: config.model,
            messages: buildMessages(playerText, meta),
            temperature: 0.85,
            max_tokens: 500
          };
          const response = await fetch(config.endpoint, {
            method: "POST",
            headers: config.headers(apiKey),
            body: JSON.stringify(payload)
          });
          const data = await response.json();
          if (!response.ok) {
            const message = data?.error?.message || `HTTP ${response.status}`;
            throw new Error(message);
          }
          return parseAiResponse(data);
        }

        async function runStoryTurn(playerText, meta = {}) {
          if (!apiKey) {
            const providerName = getProviderConfig().displayName;
            addMessage(`Add your ${providerName} API key in the header to contact the story model.`, "system");
            setStatus("Add an API key to continue.");
            return;
          }
          if (isProcessingTurn) {
            addMessage("Still waiting on the previous turn. Give it a moment.", "system");
            return;
          }

          isProcessingTurn = true;
          clearChoices("Echo is considering your move...");
          setStatus("Echo is thinking...");

          try {
            const aiPayload = ensurePayloadIntegrity(await requestStoryBeat(playerText, meta));
            const combinedText = aiPayload.prompt
              ? `${aiPayload.response}\n\n${aiPayload.prompt}`
              : aiPayload.response;

            applyStateUpdates(aiPayload);
            if (!meta.skipHistory) {
              const descriptor =
                typeof meta.choiceIndex === "number"
                  ? `Choice ${meta.choiceIndex + 1}: ${playerText}`
                  : meta.isBootstrap
                  ? "Bootstrap action"
                  : `Player: ${playerText}`;
              remember("user", descriptor);
            }
            remember(
              "assistant",
              [
                `Narration: ${aiPayload.response}`,
                aiPayload.scene ? `Scene: ${aiPayload.scene}` : "",
                aiPayload.prompt ? `Prompt: ${aiPayload.prompt}` : "",
                typeof aiPayload.relationship_delta === "number"
                  ? `Relationship delta: ${aiPayload.relationship_delta}`
                  : ""
              ]
                .filter(Boolean)
                .join("\n")
            );

            addMessage(combinedText, "game");
            speak(aiPayload.response);
            renderChoices(aiPayload.choices);
          } catch (error) {
            console.error(error);
            addMessage("Story engine error: " + error.message, "system");
            clearChoices("Waiting for a valid response...");
            setStatus("Waiting for a valid response...");
          } finally {
            isProcessingTurn = false;
            if (awaitingChoice) {
              setStatus("Choose your next move.");
            } else {
              setStatus("Idle");
            }
          }
        }

        saveKeyBtn.addEventListener("click", () => {
          const value = apiKeyInput.value.trim();
          if (!value) {
            addMessage("Enter a valid API key before saving.", "system");
            return;
          }
          apiKey = value;
          providerKeys[currentProvider] = value;
          persistKeyMap();
          addMessage(`${getProviderConfig().displayName} API key saved locally in this browser.`, "system");
          if (!conversationHistory.length && !isProcessingTurn) {
            addMessage("Starting the scene now that a key is set...", "system");
            runStoryTurn("BEGIN", { skipHistory: true, isBootstrap: true });
          }
        });

        clearKeyBtn.addEventListener("click", () => {
          apiKeyInput.value = "";
          apiKey = "";
          delete providerKeys[currentProvider];
          persistKeyMap();
          addMessage(`${getProviderConfig().displayName} API key cleared from this device.`, "system");
          clearChoices("Add an API key to keep playing.");
          setStatus("Add an API key to keep playing.");
        });

        function startStory() {
          addMessage("You step into Shibuya High and breathe in the chalk dust.", "game");
          setStatus("Echo is setting the scene...");
          runStoryTurn("BEGIN", { skipHistory: true, isBootstrap: true });
          if (!apiKey) {
            addMessage(
              `Tip: add your ${getProviderConfig().displayName} API key above to let the AI drive the narrative.`,
              "system"
            );
          }
          addMessage("When you're ready, tap one of Echo's options to answer Yuta.", "system");
        }

        startStory();
      })();
    </script>
  </body>

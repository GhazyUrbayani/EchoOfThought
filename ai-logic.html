  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Voice Story Prototype</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111;
        color: #eee;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      header {
        padding: 12px 16px;
        background: #181818;
        border-bottom: 1px solid #333;
        font-weight: 600;
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
      }

      .title {
        font-size: 1.05rem;
        letter-spacing: 0.02em;
      }

      .api-controls {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-weight: 400;
        font-size: 0.85rem;
        color: #bbb;
      }

      .api-controls label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #aaa;
      }

    .api-controls .provider-row,
    .api-controls .key-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .api-controls select {
      background: #111;
      color: #fff;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 6px 10px;
      min-width: 180px;
    }

    .api-controls input {
      background: #111;
      color: #fff;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 6px 10px;
        min-width: 220px;
      }

      .api-controls button {
        background: #2d52a2;
        border: none;
        color: #fff;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.85rem;
      }

      .api-controls button:hover {
        background: #3c64c5;
      }

      .api-controls #clear-key {
        background: #444;
      }

      .api-controls #clear-key:hover {
        background: #555;
      }

      #log {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
      }

      .msg {
        margin-bottom: 10px;
        max-width: 80%;
        line-height: 1.4;
        white-space: pre-wrap;
      }

      .msg.system {
        color: #aaa;
        font-size: 0.9rem;
      }

      .msg.player {
        background: #2b4c7e;
        padding: 8px 10px;
        border-radius: 12px 12px 0 12px;
        margin-left: auto;
      }

      .msg.game {
        background: #222;
        padding: 8px 10px;
        border-radius: 12px 12px 12px 0;
        margin-right: auto;
      }

    footer {
      padding: 12px 16px;
      background: #181818;
      border-top: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      width: 100%;
    }

    .choices.empty {
      color: #777;
      font-style: italic;
    }

    .choice-btn {
      flex: 1 1 calc(50% - 10px);
      min-width: 160px;
      background: #262b3a;
      border: 1px solid #394866;
      border-radius: 10px;
      color: #fff;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, border 0.15s;
    }

    .choice-btn:hover {
      background: #33507f;
      border-color: #4f6da6;
    }

    #status {
        font-size: 0.85rem;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <header>
    <div class="title">Voice Story - Prototype</div>
    <div class="api-controls">
      <div class="provider-row">
        <label for="provider-select">Provider</label>
        <select id="provider-select">
          <option value="openrouter">OpenRouter</option>
          <option value="groq">Groq</option>
          <option value="openai">OpenAI</option>
        </select>
      </div>
      <label for="api-key" id="api-key-label">OpenRouter API Key</label>
      <div class="key-row">
        <input type="password" id="api-key" placeholder="sk-or-..." autocomplete="off" />
        <button id="save-key" type="button">Save</button>
        <button id="clear-key" type="button">Clear</button>
      </div>
      <small id="api-hint">Get one at openrouter.ai (stored locally only).</small>
    </div>
  </header>

  <div id="log"></div>

  <div id="choices" class="choices empty">Waiting for Echo to offer actions...</div>

  <footer>
    <div id="status">Loading...</div>
  </footer>

    <script src="app.js"></script>
  </body>
  </html>

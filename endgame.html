<!DOCTYPE html>
<html class="dark" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo of Thought - Game Selesai</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Press Start 2P', 'Courier New', Courier, monospace;
            background-color: #101622;
            color: #f2f2f2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .crt-overlay::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(rgba(0,0,0,0.3) 0px, rgba(0,0,0,0.3) 1px, transparent 1px, transparent 2px);
            opacity: 0.5;
            pointer-events: none;
            z-index: 100;
        }

        .crt-vignette {
            box-shadow: inset 0 0 100px 30px rgba(0,0,0,0.5);
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        .endgame-box {
            background-color: #1a3a68;
            border: 4px solid #38d0e5;
            box-shadow: 4px 4px 0px #000000;
            padding: 40px 30px;
            text-align: center;
        }

        h1 {
            color: #38d0e5;
            font-size: 3rem;
            margin-bottom: 30px;
            text-shadow: 3px 3px 0 #1a3a68, 6px 6px 0 #000;
            line-height: 1.3;
        }

        .result-text {
            color: #f2f2f2;
            font-size: 1rem;
            margin-bottom: 40px;
            line-height: 1.8;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }

        button {
            font-family: 'Press Start 2P', 'Courier New', Courier, monospace;
            background-color: #1a3a68;
            color: #f2f2f2;
            border: 4px solid #38d0e5;
            padding: 15px 25px;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000000;
            transition: all 0.1s;
            text-transform: uppercase;
        }

        button:hover {
            background-color: #38d0e5;
            color: #1a3a68;
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('19fa38c0884e9f650a2faa13edba9f8a.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
        }
        
        .background-overlay::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(16, 22, 34, 0.7);
            z-index: 1;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            
            button {
                font-size: 0.7rem;
                padding: 12px 20px;
            }
            
            .endgame-box {
                padding: 30px 20px;
            }
            
            .result-text {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="background-overlay crt-overlay crt-vignette"></div>
    
    <div class="container">
        <div class="endgame-box">
            <h1>GAME SELESAI</h1>
            
            <div class="result-text">
                Terima kasih telah menjelajahi pikiran dan emosimu melalui Echo of Thought.
                <br><br>
                Setiap pilihan mencerminkan bagian dari dirimu.
            </div>
            
            <div class="button-container">
                <button onclick="window.location.href='game.html'">
                    MAIN LAGI
                </button>
                <button onclick="window.location.href='index.html'">
                    MENU UTAMA
                </button>
            </div>
        </div>
    </div>
</body>
</html>

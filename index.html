<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Retro Game Main Menu</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Space+Grotesk:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<style>
    body {
      font-family: 'Press Start 2P', cursive;
    }
    .font-display {
        font-family: 'Press Start 2P', cursive;
    }
    .crt-overlay::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: repeating-linear-gradient(rgba(0,0,0,0.3) 0px, rgba(0,0,0,0.3) 1px, transparent 1px, transparent 2px);
        opacity: 0.5;
        pointer-events: none;
        z-index: 100;
    }
    .crt-vignette {
        box-shadow: inset 0 0 100px 30px rgba(0,0,0,0.5);
    }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#38d0e5", /* Cyan border */
            "primary-hover": "#2ab8cc",
            "secondary": "#38d0e5", /* Cyan */
            "background-light": "#101622",
            "background-dark": "#101622",
            "narrative-box": "#1a3a68",
            "narrative-text": "#f2f2f2",
          },
          fontFamily: {
            "display": ["'Press Start 2P'", "cursive"]
          },
          borderRadius: {
            "DEFAULT": "0px",
            "lg": "0px",
            "xl": "0px",
            "full": "9999px"
          },
          boxShadow: {
            'pixel-hard': '4px 4px 0px #000000',
            'pixel-hard-hover': '6px 6px 0px #000000'
          }
        },
      },
    }
  </script>
</head>
<body class="bg-background-dark font-display text-white selection:bg-primary selection:text-black">
<div class="relative flex h-screen w-full flex-col overflow-hidden">
<!-- Animated Background -->
<div class="absolute inset-0 z-0 h-full w-full" style="background-image: url('19fa38c0884e9f650a2faa13edba9f8a.gif'); background-size: cover; background-position: center; background-repeat: no-repeat;">
<div class="absolute inset-0 bg-gradient-to-t from-background-dark via-background-dark/50 to-transparent" style="background-color: rgba(16, 22, 34, 0.7);"></div>
</div>
<!-- CRT Screen Overlay -->
<div class="absolute inset-0 z-10 crt-overlay crt-vignette pointer-events-none"></div>
<!-- Main Content -->
<div class="relative z-20 flex h-full grow flex-col">
<div class="flex flex-1 items-center justify-center p-5">
<div class="flex w-full max-w-lg flex-col items-center">
<!-- HeadlineText -->
<div class="w-full">
<h1 class="text-4xl font-bold leading-tight tracking-wider text-center pb-12 pt-6" style="color: #f2f2f2; text-shadow: 3px 3px 0 #38d0e5, 6px 6px 0 #000;">Echo of Thought</h1>
</div>
<!-- ButtonGroup -->
<div class="flex w-full justify-center">
<div class="flex w-full max-w-sm flex-col items-stretch gap-6 px-4 py-3">
<button onclick="window.location.href='game.html'" class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden border-4 bg-narrative-box px-5 py-3 text-base font-bold leading-normal tracking-widest shadow-pixel-hard transition-all hover:bg-primary hover:shadow-pixel-hard-hover active:translate-x-1 active:translate-y-1 active:shadow-none" style="border-color: #38d0e5; color: #f2f2f2;">
<span class="truncate">MULAI CERITA</span>
</button>
</div>
</div>
</div>
</div>
<!-- MetaText -->
<div class="w-full pb-4">
<p class="text-center text-xs font-normal leading-normal tracking-widest" style="color: #f2f2f2; opacity: 0.7;">v1.0.0 - Garasi Bill Gates</p>
</div>
</div>
</div>
</body></html>

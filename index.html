<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo of Thought - Demo Lomba</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <script src="https://webgazer.cs.brown.edu/webgazer.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #0d0d0d;
            color: #f0f0f0;
            font-family: 'Courier New', Courier, monospace;
        }
        main {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #webgazerVideoFeed {
            position: fixed !important;
            top: 20px !important;
            left: 20px !important;
            width: 200px !important;
            height: 200px !important;
            border-radius: 50% !important;
            border: 4px solid #00ff00 !important;
            z-index: 999 !important;
            object-fit: cover !important;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5) !important;
        }
        #webgazerFaceOverlay, 
        #webgazerFaceFeedbackBox,
        .webgazer_face_feedback {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            position: fixed !important;
            top: -9999px !important;
            left: -9999px !important;
        }
        #permission-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
            padding: 20px;
        }
        #permission-modal h1 {
            color: #fff;
            font-size: 2rem;
            margin-bottom: 20px;
        }
        #permission-modal p {
            color: #ccc;
            font-size: 1rem;
            max-width: 500px;
            margin-bottom: 30px;
        }
        #permission-button {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-family: 'Courier New', Courier, monospace;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        #permission-button:hover {
            background-color: #45a049;
        }
        #loading-text {
            display: none;
            font-size: 1.2rem;
            color: #fff;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="permission-modal">
        <h1>Echo of Thought</h1>
        <p>Aplikasi ini membaca tatapan matamu. <br> Izinkan akses webcam untuk memulai.
            <br><br>
            <strong>PENTING: Pastikan wajah Anda SANGAT TERANG dan tidak membelakangi jendela.</strong>
        </p>
        <button id="permission-button">Izinkan Kamera</button>
        <p id="loading-text">Memulai AI WebGazer... Harap tunggu.</p>
    </div>

    <main id="main"></main>

    <script>
        let gazeX, gazeY;
        let displayGazeX, displayGazeY;
        let lastGazeUpdate = 0;
        const GAZE_UPDATE_INTERVAL = 150;
        let gameState = 'START';
        let calibrationPoints = [];
        let calibrationIndex = 0;
        const TOTAL_CALIBRATION_POINTS = 9;
        let faceCanvas, faceCtx;
        let videoElement;

        class GazeOrb {
            constructor(label, quadrant, color) {
                this.label = label;
                this.quadrant = quadrant;
                this.color = color;
                this.timer = 0;
                this.hover = false;
                this.brightness = 0;
            }

            checkGaze() {
                if (!gazeX || !gazeY) return;

                let isLeft = gazeX < windowWidth / 2;
                let isTop = gazeY < windowHeight / 2;

                if (this.quadrant === 'top-left') {
                    this.hover = isLeft && isTop;
                } else if (this.quadrant === 'top-right') {
                    this.hover = !isLeft && isTop;
                } else if (this.quadrant === 'bottom-left') {
                    this.hover = isLeft && !isTop;
                } else if (this.quadrant === 'bottom-right') {
                    this.hover = !isLeft && !isTop;
                }
            }

            update() {
                if (this.hover) {
                    this.timer++;
                    this.brightness = lerp(this.brightness, 80, 0.1);
                } else {
                    this.timer = 0;
                    this.brightness = lerp(this.brightness, 20, 0.1);
                }
            }

            draw() {
                let x, y, w, h;
                w = windowWidth / 2;
                h = windowHeight / 2;

                if (this.quadrant === 'top-left') {
                    x = 0; y = 0;
                } else if (this.quadrant === 'top-right') {
                    x = windowWidth / 2; y = 0;
                } else if (this.quadrant === 'bottom-left') {
                    x = 0; y = windowHeight / 2;
                } else if (this.quadrant === 'bottom-right') {
                    x = windowWidth / 2; y = windowHeight / 2;
                }

                fill(this.color[0], this.color[1], this.color[2], this.brightness);
                noStroke();
                rect(x, y, w, h);

                stroke(255, 100);
                strokeWeight(3);
                line(windowWidth / 2, 0, windowWidth / 2, windowHeight);
                line(0, windowHeight / 2, windowWidth, windowHeight / 2);

                noStroke();
                fill(255);
                textSize(36);
                textAlign(CENTER, CENTER);
                text(this.label, x + w / 2, y + h / 2);

                if (this.timer > 0) {
                    let angle = map(this.timer, 0, GAZE_TIME_TO_SELECT, 0, TWO_PI);
                    let centerX = x + w / 2;
                    let centerY = y + h / 2;
                    noFill();
                    stroke(255, 255, 0);
                    strokeWeight(8);
                    arc(centerX, centerY, 120, 120, -HALF_PI, -HALF_PI + angle);
                    fill(255, 255, 0);
                    noStroke();
                    textSize(20);
                    let percent = Math.floor((this.timer / GAZE_TIME_TO_SELECT) * 100);
                    text(percent + '%', centerX, centerY + 60);
                }
            }
        }

        let orbA, orbB, orbC, orbD;
        let selectedChoice = "";
        const GAZE_TIME_TO_SELECT = 120;

        function setup() {
            let canvas = createCanvas(windowWidth, windowHeight);
            canvas.parent('main');
            textAlign(CENTER, CENTER);
            textFont('Courier New');
            orbA = new GazeOrb('HARAPAN', 'top-left', [100, 150, 255]);
            orbB = new GazeOrb('KETAKUTAN', 'top-right', [200, 50, 100]);
            orbC = new GazeOrb('KETENANGAN', 'bottom-left', [100, 200, 150]);
            orbD = new GazeOrb('KEBINGUNGAN', 'bottom-right', [200, 150, 50]);
            
            // Create canvas for face processing with higher resolution
            faceCanvas = document.createElement('canvas');
            faceCanvas.width = 400;  // Higher internal resolution
            faceCanvas.height = 400;
            faceCanvas.style.position = 'fixed';
            faceCanvas.style.top = '20px';
            faceCanvas.style.left = '20px';
            faceCanvas.style.width = '200px';  // Display size
            faceCanvas.style.height = '200px';
            faceCanvas.style.borderRadius = '50%';
            faceCanvas.style.border = '4px solid #00ff00';
            faceCanvas.style.zIndex = '1000';
            faceCanvas.style.boxShadow = '0 0 20px rgba(0, 255, 0, 0.5)';
            faceCanvas.style.imageRendering = 'auto';  // Smooth rendering
            document.body.appendChild(faceCanvas);
            faceCtx = faceCanvas.getContext('2d', { alpha: false, willReadFrequently: true });
            faceCtx.imageSmoothingEnabled = true;
            faceCtx.imageSmoothingQuality = 'high';
        }

        function processVideoFeed() {
            if (!videoElement) {
                videoElement = document.getElementById('webgazerVideoFeed');
            }
            
            if (videoElement && videoElement.videoWidth > 0) {
                faceCtx.save();
                
                // Clear canvas with black background
                faceCtx.fillStyle = '#000000';
                faceCtx.fillRect(0, 0, 400, 400);
                
                // Create circular clipping path (scaled for higher resolution)
                faceCtx.beginPath();
                faceCtx.arc(200, 200, 190, 0, Math.PI * 2);
                faceCtx.clip();
                
                // Enable high quality image smoothing
                faceCtx.imageSmoothingEnabled = true;
                faceCtx.imageSmoothingQuality = 'high';
                
                // Draw video at higher resolution
                faceCtx.drawImage(videoElement, 0, 0, 400, 400);
                
                // Get image data to process
                let imageData = faceCtx.getImageData(0, 0, 400, 400);
                let data = imageData.data;
                
                // Convert to high contrast silhouette with better threshold
                for (let i = 0; i < data.length; i += 4) {
                    let brightness = (data[i] + data[i + 1] + data[i + 2]) / 3;
                    // Create silhouette effect - dark areas become black, bright areas stay
                    if (brightness > 70) {
                        // Keep original colors with slight enhancement
                        data[i] = Math.min(255, data[i] * 1.05);
                        data[i + 1] = Math.min(255, data[i + 1] * 1.05);
                        data[i + 2] = Math.min(255, data[i + 2] * 1.05);
                    } else {
                        // Darken background
                        data[i] = 0;
                        data[i + 1] = 0;
                        data[i + 2] = 0;
                    }
                }
                
                faceCtx.putImageData(imageData, 0, 0);
                faceCtx.restore();
                
                // Draw oval border (scaled)
                faceCtx.strokeStyle = '#00ff00';
                faceCtx.lineWidth = 6;
                faceCtx.beginPath();
                faceCtx.arc(200, 200, 194, 0, Math.PI * 2);
                faceCtx.stroke();
            }
        }

        function draw() {
            background(13, 13, 13);
            
            // Process video feed for face display
            if (gameState !== 'START') {
                processVideoFeed();
            }
            
            if (gazeX && gazeY && millis() - lastGazeUpdate >= GAZE_UPDATE_INTERVAL) {
                displayGazeX = gazeX;
                displayGazeY = gazeY;
                lastGazeUpdate = millis();
            }
            
            switch (gameState) {
                case 'CALIBRATING': drawCalibrationScene(); break;
                case 'CHOICE': drawChoiceScene(); break;
                case 'FINAL': drawFinalScene(); break;
            }
            if (displayGazeX && gameState !== 'START') {
                 fill(255, 0, 0, 150);
                 noStroke();
                 ellipse(displayGazeX, displayGazeY, 20, 20);
            }
        }

        function drawCalibrationScene() {
            if (!calibrationPoints || calibrationPoints.length === 0) return;
            let currentPoint = calibrationPoints[calibrationIndex];
            if (!currentPoint) return;
            
            // Draw instruction text at bottom to avoid overlap
            fill(0, 0, 0, 200);
            noStroke();
            rect(0, windowHeight - 120, windowWidth, 120);
            
            fill(255);
            textSize(28);
            textAlign(CENTER, CENTER);
            text(`Kalibrasi: ${calibrationIndex + 1} / ${TOTAL_CALIBRATION_POINTS}`, windowWidth / 2, windowHeight - 80);
            textSize(20);
            text("Tatap dan KLIK titik merah.", windowWidth / 2, windowHeight - 40);
            
            // Draw calibration point
            stroke(255, 255, 255);
            strokeWeight(3);
            fill(255, 0, 0);
            ellipse(currentPoint.x, currentPoint.y, 40, 40);
            
            // Add pulsing effect
            noFill();
            stroke(255, 0, 0, 150);
            strokeWeight(2);
            let pulseSize = 40 + sin(frameCount * 0.1) * 15;
            ellipse(currentPoint.x, currentPoint.y, pulseSize, pulseSize);
        }

        function drawChoiceScene() {
            orbA.checkGaze(); orbB.checkGaze(); orbC.checkGaze(); orbD.checkGaze();
            orbA.update(); orbB.update(); orbC.update(); orbD.update();
            orbA.draw(); orbB.draw(); orbC.draw(); orbD.draw();
            fill(0, 0, 0, 180); noStroke(); rect(windowWidth / 2 - 300, windowHeight / 2 - 60, 600, 120);
            fill(255); textSize(24); textAlign(CENTER, CENTER); text("Pikiran mana yang kamu rasakan?", windowWidth / 2, windowHeight / 2 - 20);
            textSize(18); text("Tatap area pilihanmu selama 2 detik.", windowWidth / 2, windowHeight / 2 + 20);
            if (orbA.timer > GAZE_TIME_TO_SELECT) { selectedChoice = orbA.label; gameState = 'FINAL'; }
            else if (orbB.timer > GAZE_TIME_TO_SELECT) { selectedChoice = orbB.label; gameState = 'FINAL'; }
            else if (orbC.timer > GAZE_TIME_TO_SELECT) { selectedChoice = orbC.label; gameState = 'FINAL'; }
            else if (orbD.timer > GAZE_TIME_TO_SELECT) { selectedChoice = orbD.label; gameState = 'FINAL'; }
        }

        function drawFinalScene() {
            fill(255); textSize(32); text('Kamu telah memilih:', windowWidth / 2, windowHeight / 2 - 40);
            if (selectedChoice === 'HARAPAN') { fill(100, 150, 255); }
            else if (selectedChoice === 'KETAKUTAN') { fill(200, 50, 100); }
            else if (selectedChoice === 'KETENANGAN') { fill(100, 200, 150); }
            else if (selectedChoice === 'KEBINGUNGAN') { fill(200, 150, 50); }
            text(selectedChoice, windowWidth / 2, windowHeight / 2 + 20);
            textSize(18); fill(150); text("Demo Selesai.", windowWidth / 2, windowHeight * 0.9);
        }

        function mousePressed() {
            if (gameState === 'CALIBRATING') {
                if (webgazer && typeof webgazer.recordClick === 'function') webgazer.recordClick(mouseX, mouseY);
                calibrationIndex++;
                if (calibrationIndex >= TOTAL_CALIBRATION_POINTS) {
                    gameState = 'CHOICE';
                    if (webgazer) { webgazer.setMouseClickCallback(null); webgazer.setRegression('ridge'); }
                }
            }
        }

        function windowResized() {
            if (!orbA || !orbB || !orbC || !orbD || frameCount === 0) return;
            resizeCanvas(windowWidth, windowHeight);
            initCalibrationPoints(); calibrationIndex = 0; if(gameState !== 'START') gameState = 'CALIBRATING';
        }

        async function startExperience() {
            document.getElementById('permission-button').style.display = 'none';
            document.getElementById('loading-text').style.display = 'block';
            initCalibrationPoints();
            await webgazer.setTracker('mediapipeIris')
                .setRegression('ridge')
                .setGazeListener((data, elapsedTime) => { if (data) { gazeX = data.x; gazeY = data.y; } })
                .saveDataAcrossSessions(false)
                .begin();
            webgazer.showVideoPreview(true).showPredictionPoints(false).applyKalmanFilter(true);
            
            // Wait a bit for video to initialize
            setTimeout(() => {
                videoElement = document.getElementById('webgazerVideoFeed');
                if (videoElement) {
                    videoElement.style.display = 'none'; // Hide original, use canvas instead
                }
            }, 500);
            
            document.getElementById('permission-modal').style.display = 'none';
            gameState = 'CALIBRATING';
        }

        function initCalibrationPoints() {
            calibrationPoints = [];
            let marginX = windowWidth * 0.15;
            let marginY = windowHeight * 0.15;
            let w = windowWidth - (marginX * 2);
            let h = windowHeight - (marginY * 2) - 120; // Reserve space for bottom text
            
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    let x = marginX + (w * (j / 2));
                    let y = marginY + (h * (i / 2));
                    
                    // Avoid top-left corner where face display is (20-220px area)
                    if (x < 250 && y < 250) {
                        x = Math.max(x, 280);
                    }
                    
                    calibrationPoints.push({ x: x, y: y });
                }
            }
        }

        document.getElementById('permission-button').addEventListener('click', startExperience);

    </script>
</body>
</html>
